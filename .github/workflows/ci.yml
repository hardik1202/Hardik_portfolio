name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        run: npm install
        working-directory: ./Backend

      - name: Run ESLint
        run: npx eslint . --ext .js --no-eslintrc --rule '{"no-unused-vars":"warn","no-undef":"error"}' --env node --env es2021
        working-directory: ./Backend

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        run: npm install
        working-directory: ./Backend

      - name: Run tests
        run: npm test
        working-directory: ./Backend
        env:
          JWT_SECRET: ci-test-secret-key-for-github-actions
          MONGO_URI: mongodb://localhost:27017/testdb
